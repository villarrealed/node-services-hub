services:
  - type: web
    name: node-services-hub
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      # ─── Hub-level configuration ───────────────────────────────────────────
      - key: BASE_URL
        value: https://node-services-hub.onrender.com

      # ─── Webex Connect SMS Bridge (/sms-bridge) ────────────────────────────
      # Phone-number <-> Webex room mapping stored in the shared Upstash Redis
      # instance below (UPSTASH_REDIS_REST_URL/TOKEN), key prefix "sms-bridge:".
      # Webex bot credentials + webhook signature secret
      - key: WEBEX_BOT_TOKEN
        sync: false
      - key: WEBEX_BOT_ID
        sync: false
      - key: WEBEX_WEBHOOK_SECRET
        sync: false
      # Email of the person to auto-add to each new SMS-bridge Webex room
      - key: SMS_RECIPIENT_EMAIL
        sync: false
      # Webex Connect inbound shared-secret + outbound webhook config
      - key: WEBEX_CONNECT_INBOUND_SECRET
        sync: false
      - key: WEBEX_CONNECT_OUTBOUND_WEBHOOK_URL
        sync: false
      - key: WEBEX_CONNECT_SERVICE_KEY
        sync: false
      - key: WEBEX_CONNECT_FROM_NUMBER
        sync: false
      
      # ─── JDS Web Manager (/jds) ────────────────────────────────────────────
      # Webex OAuth credentials for JDS API access
      - key: WEBEX_CLIENT_ID
        sync: false
      - key: WEBEX_CLIENT_SECRET
        sync: false
      
      # Optional: JDS region and workspace (leave empty if not needed)
      - key: CJDS_REGION
        value: ""
      - key: CJDS_WORKSPACE_ID
        value: ""
      
      # Optional: Initial token (can be left empty, OAuth will populate)
      - key: CJDS_TOKEN
        value: ""
      
      # ─── WxCC Config MCP (/wxcc) ───────────────────────────────────────────
      # Webex OAuth credentials for WxCC API access
      - key: WXCC_CLIENT_ID
        sync: false
      - key: WXCC_CLIENT_SECRET
        sync: false
      
      # Optional: WxCC region (defaults to us1)
      - key: WXCC_REGION
        value: us1
      
      # Optional: WxCC org ID (auto-discovered from token if not set)
      - key: WXCC_ORG_ID
        value: ""
      
      # ─── Shared: Upstash Redis (token persistence for /jds and /wxcc) ─────
      # Optional but recommended: prevents token loss on Render restarts
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      
      # ─── Farmers Insurance MCP (/farmers) ──────────────────────────────────
      # No environment variables required (all data hardcoded for demo)

      # ─── Salesforce MCP (/salesforce) ──────────────────────────────────────
      # OAuth refresh-token flow against Cisco shared Salesforce org
      # (External Client App: "MCP Server", owner: edvill@cisco.com)
      - key: SF_CLIENT_ID
        sync: false
      - key: SF_CLIENT_SECRET
        sync: false
      - key: SF_REFRESH_TOKEN
        sync: false
      # Bearer token required by Webex AI Agent Studio when calling /salesforce/mcp
      - key: SALESFORCE_MCP_BEARER_TOKEN
        sync: false
      # Optional overrides (leave empty for defaults)
      - key: SF_LOGIN_URL
        value: ""
      - key: SF_INSTANCE_URL
        value: ""
      - key: SF_API_VERSION
        value: ""

      # ─── WxCC Journey Explorer (/journey) ──────────────────────────────────
      # No environment variables required.
      # Token is entered by the user in the Settings panel and stored in localStorage.
      # The hub proxies /journey/api/* → https://api.wxcc-{region}.cisco.com
      # with the Authorization header forwarded from the browser.
